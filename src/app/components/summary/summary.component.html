<div class="summary">
  <h2>Passing Students (Score > 50)</h2>

  <!-- Table -->
  <table mat-table [dataSource]="students" class="mat-elevation-z8 full-width-table">

    <!-- ID -->
    <ng-container matColumnDef="studentId">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let s">{{ s.studentId }}</td>
    </ng-container>

    <!-- First Name -->
    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef>First Name</th>
      <td mat-cell *matCellDef="let s">{{ s.firstName }}</td>
    </ng-container>

    <!-- Last Name -->
    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef>Last Name</th>
      <td mat-cell *matCellDef="let s">{{ s.lastName }}</td>
    </ng-container>

    <!-- DOB -->
    <ng-container matColumnDef="dob">
      <th mat-header-cell *matHeaderCellDef>DOB</th>
      <td mat-cell *matCellDef="let s">{{ s.dob | date:'dd-MM-yyyy' }}</td>
    </ng-container>

    <!-- Class -->
    <ng-container matColumnDef="className">
      <th mat-header-cell *matHeaderCellDef>Class</th>
      <td mat-cell *matCellDef="let s">{{ s.className }}</td>
    </ng-container>

    <!-- Score -->
    <ng-container matColumnDef="score">
      <th mat-header-cell *matHeaderCellDef>Score</th>
      <td mat-cell *matCellDef="let s">{{ s.score }}</td>
    </ng-container>

    <!-- Header + Rows -->
    <tr mat-header-row *matHeaderRowDef="['studentId','firstName','lastName','dob','className','score']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['studentId','firstName','lastName','dob','className','score'];"></tr>
  </table>

  <!-- Pagination -->
  <mat-paginator [length]="totalElements"
                 [pageSize]="size"
                 [pageSizeOptions]="[5, 10, 20, 50]"
                 (page)="onPageChange($event)">
  </mat-paginator>
</div>
